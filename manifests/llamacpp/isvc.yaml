# llama.cpp InferenceService running AmesianX's TurboQuant-patched
# llama.cpp (v1.5.2) so we can push context beyond what f16/q8_0 KV
# cache would allow in the same VRAM budget.
#
# KV cache: tbqp3 for keys, tbq3 for values. Per the paper and the
# upstream discussion (ggml-org/llama.cpp#20969), QJL correction (tbqp*)
# is only theoretically justified for keys — values go through a
# softmax-weighted sum, not a Q·K inner product — so asymmetric is both
# faster and correct.
#
# Internal benchmarks (llmkube-internal/benchmarks/turboquant/reports/
# turboquant-v152-results-20260408-113003.md) show tbqp3-K + tbq3-V cuts
# KV cache by ~60% vs f16 at the same context. That's how llama.cpp gets
# to 64K+ context on this hardware while vLLM's FP8 KV caps out near 32K.
#
# Since the v0.7.0 CRD enum for cacheTypeK / cacheTypeV doesn't include
# tbqp3 / tbq3 yet, we pass them via --cache-type-k / --cache-type-v in
# extraArgs. The operator is happy to forward them verbatim.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llamacpp-bench
  namespace: bench
  labels:
    bench.llmkube.dev/runtime: llamacpp
spec:
  modelRef: qwen36-27b-llamacpp
  runtime: llamacpp
  # TurboQuant-patched llama.cpp, AmesianX's v1.5.2 fork, built and
  # pushed to the defilan internal registry.
  image: registry.defilan.net/llmkube-turboquant:amx-v1.5.2
  # The defilan registry requires dockerconfigjson auth — same secret used
  # by the Kaniko build and the bench-runner. Must exist in bench ns.
  imagePullSecrets:
    - name: turboquant-registry-cred
  replicas: 1
  endpoint:
    port: 8080
    path: /v1/chat/completions
    type: ClusterIP
  resources:
    gpu: 2
    cpu: "8"
    memory: "16Gi"
    gpuMemory: "16Gi"
  contextSize: 65536
  parallelSlots: 16
  flashAttention: true
  jinja: true
  batchSize: 2048
  uBatchSize: 512
  extraArgs:
    - --cache-type-k
    - tbqp3
    - --cache-type-v
    - tbq3
    # Qwen3.6 inherits the thinking-enabled chat template from Qwen3.5;
    # the template honors this override-kv to disable thinking output.
    - --override-kv
    - tokenizer.chat_template.thinking=bool:false
