# llama.cpp InferenceService running AmesianX's TurboQuant-patched
# llama.cpp (v1.5.2) so we can push context beyond what f16/q8_0 KV
# cache would allow in the same VRAM budget.
#
# KV cache: tbqp3 for keys, tbq3 for values. Per the paper and the
# upstream discussion (ggml-org/llama.cpp#20969), QJL correction (tbqp*)
# is only theoretically justified for keys — values go through a
# softmax-weighted sum, not a Q·K inner product — so asymmetric is both
# faster and correct.
#
# Our own benchmarks show tbqp3-K + tbq3-V cuts KV cache by ~60% vs f16
# at the same context. That's how llama.cpp gets to 64K+ context on this
# hardware while vLLM's FP8 KV caps out near 32K.
#
# Since the v0.7.0 CRD enum for cacheTypeK / cacheTypeV doesn't include
# tbqp3 / tbq3 yet, we pass them via --cache-type-k / --cache-type-v in
# extraArgs. The operator is happy to forward them verbatim.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llamacpp-bench
  namespace: bench
  labels:
    bench.llmkube.dev/runtime: llamacpp
spec:
  modelRef: qwen36-27b-llamacpp
  runtime: llamacpp
  # TurboQuant-patched llama.cpp, AmesianX's v1.5.2 fork. Build it with
  # manifests/bench-runner/kaniko-build.yaml (or your preferred image
  # builder) and push to a registry your cluster can pull from. Update
  # the image ref below and, if your registry requires auth, create an
  # imagePullSecret named `turboquant-registry-cred` in the bench ns.
  image: <your-registry>/llmkube-turboquant:amx-v1.5.2
  imagePullSecrets:
    - name: turboquant-registry-cred
  replicas: 1
  endpoint:
    port: 8080
    path: /v1/chat/completions
    type: ClusterIP
  resources:
    gpu: 2
    cpu: "8"
    memory: "16Gi"
    gpuMemory: "16Gi"
  contextSize: 65536
  # llama.cpp divides --ctx-size by --parallel to get per-slot context.
  # With parallelSlots=16 + ctx=65536, each slot gets 4096 tokens — too
  # small for long_context (~6.5K incl. template) and nowhere near
  # long_context_extreme (~44K). Dropping to 1 gives every request the
  # full 65K context. High-concurrency long_context cells queue server-
  # side rather than run in parallel, which is noted as a methodology
  # item in the post — but the meaningful result (llama.cpp CAN serve
  # 44K context, vLLM cannot on 2× 16 GB) is captured at c=1.
  parallelSlots: 1
  flashAttention: true
  jinja: true
  batchSize: 2048
  uBatchSize: 512
  extraArgs:
    - --cache-type-k
    - tbqp3
    - --cache-type-v
    - tbq3
    # Qwen3.6 inherits the thinking-enabled chat template from Qwen3.5;
    # the template honors this override-kv to disable thinking output.
    - --override-kv
    - tokenizer.chat_template.thinking=bool:false
