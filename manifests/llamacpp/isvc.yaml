# llama.cpp InferenceService — matches the vLLM cell on:
#  - 32K context (llama.cpp can hold this comfortably with 14B)
#  - 16 concurrent slots (matches vLLM's typical max-num-seqs for c=16)
#  - flash-attention, jinja (chat template rendering)
#
# --metrics is emitted automatically by the LLMKube controller; the
# chart's default PodMonitor (port 8080, /metrics) picks it up.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llamacpp-bench
  namespace: bench
  labels:
    bench.llmkube.dev/runtime: llamacpp
spec:
  modelRef: qwen3-14b-llamacpp
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda13
  replicas: 1
  endpoint:
    port: 8080
    path: /v1/chat/completions
    type: ClusterIP
  resources:
    gpu: 2
    cpu: "8"
    memory: "16Gi"
    gpuMemory: "16Gi"
  # Matched to the vLLM cell: both runtimes use 16K to keep the comparison
  # apples-to-apples on our 2× 16 GB cards.
  contextSize: 16384
  parallelSlots: 16
  flashAttention: true
  jinja: true
  batchSize: 2048
  uBatchSize: 512
