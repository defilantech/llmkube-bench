# Kaniko build Job — builds the llmkube-bench harness image from
# /workspace (the rsynced repo on your K8s node) and pushes to your
# container registry. Retarget the `--destination` flags and `hostPath`
# below to match your environment.
#
# Prereqs (one-time):
#   - Registry credentials Secret (dockerconfigjson) in the bench namespace
#     named `turboquant-registry-cred` (or adjust the ref below)
#   - If your registry uses a private CA, an Opaque Secret named
#     `registry-ca-cert` with key `ca.crt` in the bench namespace
#   - Repo rsynced to <your-workspace-path> on the node
#
# Apply:
#   kubectl -n bench delete job/llmkube-bench-build --ignore-not-found
#   kubectl apply -f manifests/bench-runner/kaniko-build.yaml
#
# Monitor:
#   kubectl -n bench logs -f job/llmkube-bench-build
apiVersion: batch/v1
kind: Job
metadata:
  name: llmkube-bench-build
  namespace: bench
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: llmkube-bench-build
    spec:
      restartPolicy: Never
      nodeName: <your-node-name>
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --dockerfile=/workspace/Dockerfile
            - --context=dir:///workspace
            - --destination=<your-registry>/llmkube-bench:v1
            - --destination=<your-registry>/llmkube-bench:latest
            - --cache=true
            - --cache-repo=<your-registry>/llmkube-bench/cache
            - --snapshot-mode=redo
            - --compressed-caching=false
            - --log-format=text
            - --verbosity=info
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: docker-config
              mountPath: /kaniko/.docker
            - name: registry-ca
              mountPath: /kaniko/ssl/certs/registry-ca.crt
              subPath: ca.crt
          resources:
            requests:
              cpu: "4"
              memory: "4Gi"
            limits:
              cpu: "8"
              memory: "8Gi"
      volumes:
        - name: workspace
          hostPath:
            path: <your-workspace-path>
            type: Directory
        - name: docker-config
          secret:
            secretName: turboquant-registry-cred
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: registry-ca
          secret:
            secretName: registry-ca-cert
