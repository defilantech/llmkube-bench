# vLLM InferenceService — tuned to mirror the llama.cpp cell:
#   - 32K context (maxModelLen)
#   - FP8 weights + FP8 E4M3 KV cache
#   - prefix caching ON (signature vLLM feature; shines on agentic workloads)
#   - chunked prefill ON (keeps long prefills from starving decode streams)
#   - FLASHINFER attention backend
#   - skipModelInit: true (vLLM fetches its own weights from HuggingFace)
#
# Why some flags are still in extraArgs: the LLMKube v0.7.0 CRD we're
# running against doesn't yet type kvCacheDtype / enableChunkedPrefill /
# maxNumBatchedTokens / quantization=fp8. Those fields exist on main; in
# the meantime extraArgs forwards them directly to the vLLM server.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: vllm-bench
  namespace: bench
  labels:
    bench.llmkube.dev/runtime: vllm
spec:
  modelRef: qwen3-14b-vllm
  runtime: vllm
  image: vllm/vllm-openai:latest
  skipModelInit: true
  replicas: 1
  endpoint:
    port: 8000
    path: /v1/chat/completions
    type: ClusterIP
  resources:
    gpu: 2
    cpu: "8"
    memory: "32Gi"
  vllmConfig:
    tensorParallelSize: 2
    # 32K KV cache at fp8_e4m3 on Qwen3-14B (40 layers, 5120 dim) runs
    # ~6.5 GB per shard, which on top of ~7 GB weights + CUDA graphs
    # exceeds the 15.48 GiB usable per 5060 Ti. 16K halves that and
    # still exceeds llama.cpp's typical production context setting.
    maxModelLen: 16384
    dtype: bfloat16
    enablePrefixCaching: true
    attentionBackend: flashinfer
    hfTokenSecretRef:
      name: hf-token
      key: HF_TOKEN
  extraArgs:
    - --quantization
    - fp8
    - --kv-cache-dtype
    - fp8_e4m3
    - --enable-chunked-prefill
    - --max-num-batched-tokens
    - "8192"
    # Accept the harness's model="bench" string so both runtimes use the
    # same request body. (llama.cpp is permissive; vLLM enforces.)
    - --served-model-name
    - bench
    # The 5060 Ti reserves ~1 GiB outside of PyTorch (CUDA runtime, NCCL,
    # driver buffers). We need gpu-memory-utilization low enough that
    # PyTorch + that out-of-band overhead fit inside 15.48 GiB. 0.85 is
    # the first value that survived CUDA graph capture on 2× 5060 Ti.
    - --gpu-memory-utilization
    - "0.85"
  env:
    - name: PYTORCH_ALLOC_CONF
      value: "expandable_segments:True"
