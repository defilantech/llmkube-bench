# vLLM InferenceService — Qwen3.6-27B via NVFP4 on 2× RTX 5060 Ti.
#   - Tensor parallel 2 (required: single 16 GB card can't hold full weights)
#   - NVFP4 quantization (Blackwell-native 4-bit, ~7 GB per shard weights)
#   - FP8 E4M3 KV cache (matches the production default for FP8 checkpoints)
#   - Prefix caching ON (signature vLLM feature for agentic workloads)
#   - Chunked prefill ON
#   - FLASHINFER attention backend
#   - --limit-mm-per-prompt to skip vision encoder profiling
#   - gpu-memory-utilization 0.85 so PyTorch + CUDA runtime + NCCL fit
#     inside 15.48 GiB with headroom for CUDA graph capture.
#
# Context ceiling: 32K. Pushing past that runs into per-shard KV cache
# budget on 16 GB cards even with FP8 KV. See METHOD.md "Why 32K on the
# vLLM side and 64K on llama.cpp" — this asymmetry is the story.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: vllm-bench
  namespace: bench
  labels:
    bench.llmkube.dev/runtime: vllm
spec:
  modelRef: qwen36-27b-vllm
  runtime: vllm
  image: vllm/vllm-openai:latest
  skipModelInit: true
  replicas: 1
  endpoint:
    port: 8000
    path: /v1/chat/completions
    type: ClusterIP
  resources:
    gpu: 2
    cpu: "8"
    memory: "32Gi"
  vllmConfig:
    tensorParallelSize: 2
    # 32K + FP8 E4M3 KV cache + CUDA graph capture on Qwen3.6-27B-NVFP4
    # lands at ~14.8 GiB/shard on our 15.48 GiB cards — OOMs at ~784 MiB
    # shy of saturation during inductor graph allocation. 16K halves the
    # KV cache budget and fits with ~3 GiB headroom. Our llama.cpp side
    # runs 65K because TurboQuant's tbqp3/tbq3 KV cache is ~5× smaller
    # per-token than vLLM's FP8 KV. That context asymmetry IS the story.
    maxModelLen: 16384
    dtype: bfloat16
    enablePrefixCaching: true
    attentionBackend: flashinfer
    hfTokenSecretRef:
      name: hf-token
      key: HF_TOKEN
  # Some flags still ride extraArgs because the v0.7.0 CRD doesn't yet
  # type them: --kv-cache-dtype, --enable-chunked-prefill,
  # --max-num-batched-tokens, --limit-mm-per-prompt, --served-model-name.
  #
  # --quantization compressed-tensors matches what sakamakismile's NVFP4
  # checkpoint declares in its config.json. vLLM rejects `--quantization
  # nvfp4` against a compressed-tensors checkpoint as mismatched (even
  # though the kernel path ends up at nvfp4 on Blackwell); the right
  # argument is the wrapping format, not the inner dtype.
  extraArgs:
    - --quantization
    - compressed-tensors
    - --kv-cache-dtype
    - fp8_e4m3
    - --enable-chunked-prefill
    - --max-num-batched-tokens
    - "8192"
    - --gpu-memory-utilization
    - "0.85"
    - --limit-mm-per-prompt
    - '{"image":0,"video":0}'
    - --served-model-name
    - bench
    # CUDA graph capture on Qwen3.6-27B-NVFP4 (VLM) exhausts the 2x 16 GB
    # budget before KV cache init can even start — OOMs at ~14.8 GiB per
    # shard during _init_minimal_kv_cache_for_profiling. --enforce-eager
    # skips the graph capture entirely (costs ~10-15% throughput vs
    # captured graphs) and gets us running. Document in the post as
    # "vLLM's throughput win on this hardware is capped by VRAM; graph
    # capture needs more headroom than 2x 16 GB consumer cards give you
    # when the model is a VLM."
    - --enforce-eager
  env:
    - name: PYTORCH_ALLOC_CONF
      value: "expandable_segments:True"
