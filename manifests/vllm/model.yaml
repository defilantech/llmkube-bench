# vLLM candidate: Qwen3.6-27B NVFP4 (Blackwell-native 4-bit float).
# Community quant from sakamakismile tagged `blackwell` and `vlm` —
# the most explicit about our hardware target (5060 Ti is Blackwell GB206).
# Weights ~14 GB total / TP=2 = ~7 GB per shard, comfortably fitting
# 2× 15.48 GiB consumer cards alongside FP8 KV cache and CUDA graphs.
#
# Why NVFP4 and not the official FP8: Qwen's only 27B-class FP8 release
# is the VLM, whose resident vision encoder plus FP8 weights exceed the
# per-shard VRAM budget on 16 GB cards — documented in METHOD.md
# Appendix A. NVFP4 halves the weight footprint via Blackwell's native
# 4-bit float kernels, which vLLM exposes via --quantization nvfp4.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen36-27b-vllm
  namespace: bench
  labels:
    bench.llmkube.dev/runtime: vllm
    bench.llmkube.dev/model: qwen3.6-27b
    bench.llmkube.dev/quant: nvfp4
spec:
  # HF repo ID — vLLM pulls directly at pod start (skipModelInit on the ISVC).
  source: sakamakismile/Qwen3.6-27B-NVFP4
  format: safetensors
  # The v0.7.0 Model CRD enum doesn't list nvfp4 yet, so we leave the
  # Model-side quantization field blank and set vLLM's --quantization
  # on the InferenceService.
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 2
      vendor: nvidia
  resources:
    cpu: "2"
    memory: "8Gi"
